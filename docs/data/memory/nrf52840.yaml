# Memory requirement data for nRF52840 DK.
# Partition sizes are derived from dts/*.dtsi.
# Sample usage is generated from Twister build logs.

board:
  name: nRF52840 DK
  nvm_total_kb: 1024
  ram_total_kb: 256
legend_threshold_kb: 4
layouts:
  base:
    source: dts/nrf52840_partitions.dtsi
    partitions:
      - id: slot0
        label: Application
        size_kb: 980
        order: 0
        offset: 0
      - id: storage
        label: Storage
        size_kb: 8
        order: 1
        offset: 1003520
      - id: zboss_nvram
        label: ZBOSS NVRAM
        size_kb: 32
        order: 2
        offset: 1011712
      - id: zboss_product_config
        label: ZBOSS product config
        size_kb: 4
        order: 3
        offset: 1044480
        legend_only: true
  ext_flash:
    source: dts/ext_flash/nrf52840dk_partitions.dtsi
    extends: base
    partitions:
      - id: boot
        label: MCUboot
        size_kb: 64
        order: 0
        offset: 0
      - id: slot0
        label: Application
        size_kb: 916
        order: 1
        offset: 65536
    external:
      nvm_total_kb: 8192
      partitions:
        - id: slot1_ext
          label: Upgrade slot (external)
          size_kb: 916
          order: 0
          offset: 0
  mcuboot_usb:
    source: dts/mcuboot_usb_transport/nrf52840_partitions.dtsi
    extends: base
    partitions:
      - id: boot
        label: MCUboot
        size_kb: 64
        order: 0
        offset: 0
      - id: slot0
        label: Application
        size_kb: 916
        order: 1
        offset: 65536
