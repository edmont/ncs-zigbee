# Memory requirement data for nRF54L15 DK.
# Partition sizes are derived from dts/*.dtsi.
# Sample usage is generated from Twister build logs.

board:
  name: nRF54L15 DK
  nvm_total_kb: 1524
  ram_total_kb: 256
legend_threshold_kb: 4
layouts:
  base:
    source: dts/nrf54l15_cpuapp_partitions.dtsi
    partitions:
      - id: slot0
        label: Application
        size_kb: 1480
        order: 0
        offset: 0
      - id: storage
        label: Storage
        size_kb: 8
        order: 1
        offset: 1515520
      - id: zboss_nvram
        label: ZBOSS NVRAM
        size_kb: 32
        order: 2
        offset: 1523712
      - id: zboss_product_config
        label: ZBOSS product config
        size_kb: 4
        order: 3
        offset: 1556480
        legend_only: true
  ext_flash:
    source: dts/ext_flash/nrf54l15dk_cpuapp_partitions.dtsi
    extends: base
    partitions:
      - id: boot
        label: MCUboot
        size_kb: 80
        order: 0
        offset: 0
      - id: slot0
        label: Application
        size_kb: 1400
        order: 1
        offset: 81920
    external:
      nvm_total_kb: 8192
      partitions:
        - id: slot1_ext
          label: Upgrade slot (external)
          size_kb: 1400
          order: 0
          offset: 0
