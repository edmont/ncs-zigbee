# ============================================================================
# Zigbee + Matter Dual Protocol Template Configuration
# Protocol switching architecture: Not concurrent, switch at runtime
# ============================================================================

# ============================================================================
# System Configuration
# ============================================================================

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# C++ support (required for Matter)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Nordic DK library (LEDs and Buttons)
CONFIG_DK_LIBRARY=y

# Hardware support
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Threading
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n

# ============================================================================
# IEEE 802.15.4 Radio (Shared by Zigbee and OpenThread)
# ============================================================================

CONFIG_IEEE802154=y
# Disable Zephyr's native IEEE 802.15.4 driver - use Nordic radio HAL instead
CONFIG_IEEE802154_NRF5=n
CONFIG_NET_L2_IEEE802154=n

# Multi-protocol support (MPSL for radio arbitration)
CONFIG_MPSL=y

# ============================================================================
# Zigbee Configuration
# ============================================================================

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y

# ============================================================================
# OpenThread Configuration (RAW Mode for Protocol Switching)
# ============================================================================

CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=y
CONFIG_OPENTHREAD_RAW=y
CONFIG_OPENTHREAD_L2_DEBUG_DUMP_15_4=n

# Disable OpenThread L2 networking layer (avoids radio driver conflict)
CONFIG_NET_L2_OPENTHREAD=n
# Disable generic IEEE 802.15.4 radio link (use Nordic libraries)
CONFIG_OPENTHREAD_RADIO_LINK_IEEE_802_15_4_ENABLE=n

# Networking stack disabled for OpenThread RAW mode
CONFIG_NETWORKING=n

# ============================================================================
# Matter (CHIP) Configuration
# ============================================================================

CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768

# Device commissioning
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=15

# Fabric management
CONFIG_CHIP_LAST_FABRIC_REMOVED_ERASE_AND_REBOOT=y
CONFIG_CHIP_LAST_FABRIC_REMOVED_ACTION_DELAY=1000

# Use system malloc
CONFIG_CHIP_MALLOC_SYS_HEAP=n

# Disable OTA for simpler build
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_BOOTLOADER_NONE=y

# ZAP configuration (using light bulb template)
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${ZEPHYR_NRF_MODULE_DIR}/samples/matter/light_bulb/src/default_zap/light_bulb.zap"

# ============================================================================
# Matter Crypto (PSA)
# ============================================================================

CONFIG_CHIP_CRYPTO_PSA=y
CONFIG_PSA_WANT_ALG_SPAKE2P_MATTER=y
CONFIG_PSA_WANT_KEY_TYPE_SPAKE2P_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y

# ============================================================================
# mbedTLS Configuration
# ============================================================================

# Public Key operations (required for Matter certificates)
CONFIG_MBEDTLS_PK_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y

# Elliptic Curve operations
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDSA_C=y

# Allow PSA and legacy crypto to coexist
CONFIG_MBEDTLS_USE_PSA_CRYPTO=y

# ============================================================================
# Bluetooth LE (Matter Commissioning)
# ============================================================================

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ZigbeeMatter"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1

# BLE data length extension
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# GATT configuration
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_ATT_PREPARE_COUNT=2

# ============================================================================
# Networking (Matter requires IPv6/UDP/TCP)
# ============================================================================

CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

# ============================================================================
# Storage and Flash
# ============================================================================

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

