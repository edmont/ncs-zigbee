# Compile ZBOSS traces into source-built lib (CONFIG_ZBOSS_LIBRARY_SOURCES=y)
CONFIG_ZB_LOG_LEVEL_DBG=y
CONFIG_ZB_TRACE_MASK=0xFFFFFFFF

# Runtime ZBOSS trace filtering and output
CONFIG_ZBOSS_TRACE_LOG_LEVEL_DBG=y
CONFIG_ZBOSS_TRACE_MASK=0xFFFFFFFF
CONFIG_ZBOSS_TRAF_DUMP=y
CONFIG_ZBOSS_TRACE_HEXDUMP_LOGGING=y

# More headroom when traces are enabled
CONFIG_ZBOSS_TRACE_LOGGER_BUFFER_SIZE=4096
CONFIG_ZIGBEE_APP_UTILS_LOG_LEVEL_DBG=y
CONFIG_ZBOSS_OSIF_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=4096
